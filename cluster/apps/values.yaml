# Every Application in the cluster, rendered by the root app (cluster/bootstrap/root-app.yaml)
# through the argocd-apps chart. One entry per workload; the key is the Application name.
#
# Naming: shared components use the bare name (infra, monitoring, chaos-mesh); anything that
# belongs to one system carries its prefix (coprocessor-*).
# Waves: 0 infra (both chains) -> 1 monitoring (CRDs), gateway contracts Job -> 2 host contracts
# Job, workers, exporters, kms-core -> 3 host chain registration, gateway KMS context, listeners,
# gateway side, kms-connector, rules, chaos -> 4 host KMS keygen, demo.
# The coprocessor chart is installed as several releases like coprocessor-operator does:
# workers, one listener per host chain, later the gateway side. Application health checks are on (argocd-values.yaml) so a wave waits for the
# previous one to be healthy.
# Every child carries the resources finalizer: removing or renaming an entry deletes the
# Application and everything it deployed.
# The two upstream chart sources pin the commit in .fhevm-ref; CI checks they match.

projects:
  practice:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "-1" }
    description: Zama local practice
    sourceRepos: ["*"]
    destinations: [{ namespace: "*", server: https://kubernetes.default.svc }]
    clusterResourceWhitelist: [{ group: "*", kind: "*" }]

applications:
  # Postgres, minio and the anvil host chain: stand-ins for RDS, S3 and the L1.
  infra:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "0" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    source:
      repoURL: git@github.com:terrydevops/zama-local-practice.git
      targetRevision: master
      path: cluster/infra
    destination: { server: https://kubernetes.default.svc, namespace: infra }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true]

  monitoring:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "1" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://prometheus-community.github.io/helm-charts
        chart: kube-prometheus-stack
        targetRevision: 91.4.1
        helm:
          releaseName: monitoring
          valueFiles: [$values/cluster/platform/monitoring/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: monitoring }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true, ServerSideApply=true]

  # Host contracts on the anvil chain: a Job that deploys once and writes eth-sc-addresses.
  # Jobs are immutable, so a changed spec is replaced rather than patched. After the gateway
  # contracts: KMSVerifier and InputVerifier embed two gateway addresses.
  coprocessor-host-contracts:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "2" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/contracts
        helm:
          releaseName: host-contracts
          valueFiles: [$values/coprocessor/host-contracts/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true, Replace=true]
      # a failed Job fails the sync, and automated sync never retries a revision whose sync
      # failed; retry so a transient failure (chain not up yet) does not need a human
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Workers release of the upstream chart (helm release "coprocessor", so resource names,
  # alert selectors and chaos targets keep the plain coprocessor-* names).
  coprocessor-workers:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "2" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/coprocessor
        helm:
          releaseName: coprocessor
          valueFiles: [$values/coprocessor/workers/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true]

  # Postgres table counters for the dashboard, upstream chart with a public image.
  coprocessor-sql-exporter:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "2" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/coprocessor-sql-exporter
        helm:
          releaseName: coprocessor-sql-exporter
          valueFiles: [$values/coprocessor/sql-exporter/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: monitoring }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # Gateway contracts on the local gateway chain: a Job that deploys once and writes
  # gw-sc-addresses. First of the contract Jobs: it needs nothing from the host chain.
  coprocessor-gateway-contracts:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "1" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/contracts
        helm:
          releaseName: gateway-contracts
          valueFiles: [$values/coprocessor/gateway-contracts/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true, Replace=true]
      # a failed Job fails the sync, and automated sync never retries a revision whose sync
      # failed; retry so a transient failure (chain not up yet) does not need a human
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Centralized KMS core: plain manifests (see coprocessor/kms-core/kms-core.yaml for why not the
  # upstream chart). Generates its signing key on first start and publishes it to kms-public.
  kms-core:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "2" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    source:
      repoURL: git@github.com:terrydevops/zama-local-practice.git
      targetRevision: master
      path: coprocessor/kms-core
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # KMS side of the protocol: gw-listener, kms-worker, tx-sender and their database migration.
  kms-connector:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/kms-connector
        helm:
          releaseName: kms-connector
          valueFiles: [$values/coprocessor/kms-connector/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [Replace=true]
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Points the Gateway at the KMS that runs here (new KMS context with the discovered signer).
  coprocessor-gateway-kms-context:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/contracts
        helm:
          releaseName: gateway-kms-context
          valueFiles: [$values/coprocessor/gateway-kms-context/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [Replace=true]
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Host chain: KMS context and epoch on ProtocolConfig, then key and CRS generation requests.
  coprocessor-host-kms-keygen:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "4" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/contracts
        helm:
          releaseName: host-kms-keygen
          valueFiles: [$values/coprocessor/host-kms-keygen/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [Replace=true]
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Registers host chain 12345 on the GatewayConfig once both contract sets exist.
  coprocessor-gateway-host-chains:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/contracts
        helm:
          releaseName: gateway-host-chains
          valueFiles: [$values/coprocessor/gateway-host-chains/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true, Replace=true]
      retry:
        limit: 5
        backoff: { duration: 30s, factor: 2, maxDuration: 5m }

  # Gateway side of the coprocessor: gw-listener and tx-sender, one release like the operator's.
  coprocessor-gateway:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/coprocessor
        helm:
          releaseName: coprocessor-gateway
          valueFiles: [$values/coprocessor/gateway/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # host-listener for the anvil chain, one release per chain.
  coprocessor-anvil-listener:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://github.com/zama-ai/fhevm.git
        targetRevision: 6eacc84f76bf058e79571d5ca7a04d53528ecdaa
        path: charts/coprocessor
        helm:
          releaseName: coprocessor-anvil-listener
          valueFiles: [$values/coprocessor/listeners/anvil/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # Chain progress from the listener's tables (public sql_exporter chart, own queries).
  coprocessor-chain-exporter:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "2" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://burningalchemist.github.io/sql_exporter/
        chart: sql-exporter
        targetRevision: 0.18.10
        helm:
          releaseName: coprocessor-chain-exporter
          valueFiles: [$values/coprocessor/chain-exporter/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: monitoring }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # Alert rules and the Grafana dashboard for the pipeline.
  coprocessor-monitoring:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    source:
      repoURL: git@github.com:terrydevops/zama-local-practice.git
      targetRevision: master
      path: coprocessor/monitoring
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy:
      automated: { prune: true, selfHeal: true }

  # Chaos Mesh. Experiments live in coprocessor/chaos/ and are applied by hand: they are
  # one-shot, Argo CD would keep re-creating them.
  chaos-mesh:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "3" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    sources:
      - repoURL: https://charts.chaos-mesh.org
        chart: chaos-mesh
        targetRevision: 2.8.4
        helm:
          releaseName: chaos-mesh
          valueFiles: [$values/cluster/platform/chaos-mesh/values.yaml]
      - repoURL: git@github.com:terrydevops/zama-local-practice.git
        targetRevision: master
        ref: values
    destination: { server: https://kubernetes.default.svc, namespace: chaos-mesh }
    syncPolicy:
      automated: { prune: true, selfHeal: true }
      syncOptions: [CreateNamespace=true, ServerSideApply=true]

  # End-to-end check as a Sync-hook Job. Manual sync only: sync == run the check (make demo).
  coprocessor-demo:
    namespace: argocd
    additionalAnnotations: { argocd.argoproj.io/sync-wave: "4" }
    finalizers: [resources-finalizer.argocd.argoproj.io]
    project: practice
    source:
      repoURL: git@github.com:terrydevops/zama-local-practice.git
      targetRevision: master
      path: coprocessor/demo/k8s
    destination: { server: https://kubernetes.default.svc, namespace: coproc }
    syncPolicy: {}
