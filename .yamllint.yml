# Chart values and manifests carry long comment lines on purpose, and resources are written
# in flow style with a space inside the braces ({ cpu: 100m, memory: 512Mi }).
extends: default
rules:
  line-length: disable
  document-start: disable
  comments-indentation: disable
  braces: { min-spaces-inside: 0, max-spaces-inside: 1 }
  brackets: { min-spaces-inside: 0, max-spaces-inside: 1 }
  colons: { max-spaces-after: -1 }   # aligned values
  truthy:
    allowed-values: ['true', 'false', 'on', 'off']
    check-keys: false   # `on:` in workflows
