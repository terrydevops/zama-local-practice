# Switches the Gateway to the KMS that actually runs here (upstream: the last gateway-sc step,
# updateKmsContext). The contracts were deployed with the template's placeholder signer; the
# real KMS signing key is generated by kms-core and published to the kms-public bucket, so this
# Job discovers the address there, registers a new KMS context with it, and funds the
# connector's tx-sender wallet on the gateway chain. Same chart and image as the gateway deploy,
# same addresses volume (hardhat needs the generated GatewayAddresses.sol to compile).
#
# Deployed by Argo CD (coprocessor-gateway-kms-context in cluster/apps/values.yaml), after kms-core.

scDeploy:
  enabled: true
  preventRedeployment: true
  image:
    name: local/gateway-contracts
    tag: dev
  configmap:
    name: gw-kms-context
  env:
    - { name: HARDHAT_NETWORK, value: staging }
    - { name: RPC_URL, value: "http://anvil-gateway.infra.svc.cluster.local:8545" }
    - name: DEPLOYER_PRIVATE_KEY
      valueFrom: { secretKeyRef: { name: gateway-deployer, key: deployer-private-key } }
    # one KMS node; signer address is discovered at run time, tx-sender is the connector wallet
    - { name: NUM_KMS_NODES, value: "1" }
    - { name: PUBLIC_DECRYPTION_THRESHOLD, value: "1" }
    - { name: USER_DECRYPTION_THRESHOLD, value: "1" }
    - { name: KMS_GENERATION_THRESHOLD, value: "1" }
    - { name: MPC_THRESHOLD, value: "0" }
    - { name: KMS_TX_SENDER_ADDRESS_0, value: "0x31de9c8ac5ecd5eaceddddee531e9bad8ac9c2a5" }
    - { name: KMS_NODE_IP_ADDRESS_0, value: "127.0.0.1" }
    - { name: KMS_NODE_IP_0, value: "127.0.0.1" }
    - { name: KMS_NODE_STORAGE_URL_0, value: "http://minio.infra.svc.cluster.local:9000/kms-public" }
    - { name: KMS_NODE_PARTY_ID_0, value: "1" }
    - { name: KMS_NODE_MPC_IDENTITY_0, value: "kms-node-0" }
    - { name: KMS_NODE_CA_CERT_0, value: "0x" }
    - { name: KMS_NODE_STORAGE_PREFIX_0, value: "kms-node-0" }
    - { name: KMS_SOFTWARE_VERSION, value: "0.1.0" }
    - { name: KMS_PCR_VALUES, value: '[{"pcr0":"0x00","pcr1":"0x00","pcr2":"0x00"}]' }
    # a new context id: the initial one was set at deploy with the template signer
    - { name: KMS_CONTEXT_ID, value: "3166189940082864718613269121331309980362851143201109172953918312716374638594" }
  deployCommands:
    - until cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1; do echo "waiting for $RPC_URL"; sleep 3; done
    # practice only: gas for the connector's tx-sender on the gateway chain
    - cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$KMS_TX_SENDER_ADDRESS_0" 0x3635C9ADC5DEA00000 >/dev/null
    # the KMS signing key lives in the public kms-public bucket; read its address from there
    - until key=$(curl -sf "http://minio.infra.svc.cluster.local:9000/kms-public/?list-type=2&prefix=PUB/VerfAddress/" | grep -oE "<Key>[^<]+</Key>" | head -1 | sed "s#<Key>##;s#</Key>##") && [ -n "$key" ]; do echo "waiting for the KMS signing key in kms-public"; sleep 5; done
    - export KMS_SIGNER_ADDRESS_0=$(curl -sf "http://minio.infra.svc.cluster.local:9000/kms-public/$key"); echo "KMS signer $KMS_SIGNER_ADDRESS_0"
    - npx hardhat task:updateKmsContext --use-internal-proxy-address true
    - printf 'KMS_SIGNER_ADDRESS=%s\n' "$KMS_SIGNER_ADDRESS_0" > addresses/.env.kmscontext
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { cpu: "1", memory: 2Gi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    fsGroup: 10001

persistence:
  enabled: true
  mountPath: /app/addresses
  volumeClaim:
    name: gateway-contracts-addresses
    create: false

scUpgrade:
  enabled: false
