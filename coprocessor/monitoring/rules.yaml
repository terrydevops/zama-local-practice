# Alerts for the pipeline. The first group grew out of the two failure modes exercised by hand
# (C1: sns-worker down, C2: S3 unreachable) and the chain incidents; metric sources are the
# sql-exporter, the chain-exporter and the workers themselves.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: coprocessor
  namespace: coproc
spec:
  groups:
    - name: coprocessor
      rules:
        - alert: CoprocessorSnsBacklog
          expr: pbs_completion{status="uncompleted"} > 0
          for: 1m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} handles waiting for SnS"
            description: "pbs_computations has had unprocessed rows for 1m. Check the sns-worker pod first."

        - alert: CoprocessorUploadsStuck
          # gauge disappears while the pod is down; WorkerDown covers that case
          expr: max(coprocessor_sns_worker_uncomplete_aws_uploads_gauge) > 0
          for: 2m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} ciphertexts converted but not uploaded"
            description: "sns-worker finished SnS but S3 uploads are not completing. Check S3 credentials, endpoint and DNS."

        - alert: CoprocessorUploadFailures
          # a short burst right after a restart is normal; only sustained failures page
          expr: sum(increase(coprocessor_sns_worker_aws_upload_failure_counter[2m])) > 0
          for: 3m
          labels: { severity: warning }
          annotations:
            summary: "sustained sns-worker upload failures"

        - alert: CoprocessorComputationsStalled
          expr: computations_completion{status="uncompleted"} > 0 and rate(computations_completion{status="completed"}[5m]) == 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} computations pending and nothing completing"
            description: "Work is queued but tfhe-worker is not making progress. Check dependence_chain rows and the tfhe-worker pod."

        - alert: CoprocessorCrashLoop
          # seen in C2: an S3 partition exhausts the DB pool and the worker panics and restarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="coproc", container=~"coprocessor-.*"}[10m]) >= 2
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.container }} restarted {{ $value }} times in 10m"
            description: "Look at the previous container log (kubectl logs --previous) for the panic."

        - alert: InfraCrashLoop
          expr: increase(kube_pod_container_status_restarts_total{namespace="infra"}[10m]) >= 2
          for: 1m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.pod }} in infra is restarting"
            description: "postgres, minio or the host chain is crash-looping; the coprocessor pods will look healthy while they wait on it."
        - alert: HostChainStalled
          expr: host_chain_last_valid_block_age_seconds > 120
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "chain {{ $labels.chain_id }}: no block validated for {{ $value | humanizeDuration }}"
            description: "The host chain stopped producing blocks or the listener lost it. Every coprocessor pod stays healthy in this state; check anvil in infra first, then the listener's RPC connection."
        - alert: GatewayStalled
          expr: increase(gateway_listener_last_block[5m]) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "gw-listener has not advanced on the Gateway for 5 minutes"
            description: "The gateway chain stopped, or gw-listener lost its RPC. Digests and proof responses queue up in the database meanwhile."
        - alert: CoprocessorDigestsUnsent
          expr: ciphertext_digests_unsent > 0 and increase(ciphertext_digests_unsent[10m]) >= 0
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} digests waiting for tx-sender"
            description: "sns-worker recorded digests that tx-sender has not delivered to the Gateway in 10 minutes: tx-sender down, no gas, or the Gateway rejecting the transactions."
        - alert: HostChainExporterDown
          expr: absent(host_chain_last_valid_block_age_seconds)
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "no chain progress metrics"
            description: "coprocessor-chain-exporter is not scraping; HostChainStalled cannot fire."
        - alert: AnvilMemoryHigh
          expr: container_memory_working_set_bytes{namespace="infra", container="anvil"} / on(namespace, pod, container) kube_pod_container_resource_limits{resource="memory"} > 0.7
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "anvil is using more than 70% of its memory limit"
            description: "The state dump has grown; run make chain-compact before the next dump gets OOM-killed and leaves a truncated file."
        - alert: CoprocessorWorkerDown
          expr: up{job=~"coprocessor-.*"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.job }} metrics endpoint down"

    # KMS side: kms-core (centralized, insecure build) and the three kms-connector components.
    - name: kms
      rules:
        - alert: KmsDown
          expr: up{job=~"kms-core|kms-connector-.*"} == 0
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.job }} metrics endpoint down"
            description: "Decryption requests on the gateway get no answer while any KMS piece is down."

        - alert: KmsConnectorBacklog
          expr: sum(kms_connector_unprocessed_operations) > 0
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $value }} KMS responses not yet sent to the gateway"
            description: "kms-connector tx-sender has had unsent responses for 5m: gateway RPC, wallet gas, or a contract revert (NotKmsSigner, wrong fee token)."

        - alert: KmsConnectorErrors
          expr: >
            sum(increase(kms_connector_worker_grpc_request_sent_errors[15m]))
            + sum(increase(kms_connector_worker_event_received_errors[15m]))
            + sum(increase(kms_connector_tx_sender_response_received_errors[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "kms-connector reported errors in the last 15m"
            description: "Worker could not reach kms-core, rejected an event (host ACL check, S3 fetch), or tx-sender got an error response."

        - alert: KmsDecryptionSlow
          expr: histogram_quantile(0.9, sum by (le) (rate(kms_connector_worker_decryption_latency_seconds_bucket[15m]))) > 30
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "p90 decryption latency {{ $value | humanizeDuration }}"
            description: "kms-worker to kms-core round trip is slow: kms-core CPU, or the S3 ciphertext fetch."

        - alert: KmsCoreDecryptionErrors
          expr: sum(increase(kms_operation_errors_total{operation=~".*decrypt.*"}[15m])) > 0
          labels: { severity: warning }
          annotations:
            summary: "kms-core failed decryption operations in the last 15m"
            description: "Usually a key id the KMS does not hold (coprocessor and KMS disagree on the active key) or a bad ciphertext."
