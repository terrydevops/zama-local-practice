# Deploys the gateway contracts to the local gateway chain with the upstream chart
# fhevm/charts/contracts, the same way coprocessor-host-contracts does for the host chain.
# Writes every address into the ConfigMap gw-sc-addresses (keys like input_verification.address)
# and stamps contracts.version; with preventRedeployment the Job is a no-op afterwards.
# Environment mirrors test-suite/fhevm/templates/env/.env.gateway-sc (public test addresses only);
# the deployer key comes from the generated Secret gateway-deployer (account 1 of the gateway
# phrase, as upstream). The host chain is registered with the addresses the host deploy wrote.
#
# Deployed by Argo CD (coprocessor-gateway-contracts in cluster/apps/values.yaml) into coproc,
# one wave after the host contracts because it reads eth-sc-addresses.

scDeploy:
  enabled: true
  preventRedeployment: true
  image:
    name: local/gateway-contracts     # practice: built by coprocessor/images/build.sh
    tag: dev
  configmap:
    name: gw-sc-addresses
  env:
    - { name: HARDHAT_NETWORK, value: staging }          # chain id 54321 in hardhat.config.ts
    - { name: RPC_URL, value: "http://anvil-gateway.infra.svc.cluster.local:8545" }
    - { name: CHAIN_ID_GATEWAY, value: "54321" }
    - name: MNEMONIC
      valueFrom: { secretKeyRef: { name: gateway-deployer, key: mnemonic } }
    - name: DEPLOYER_PRIVATE_KEY
      valueFrom: { secretKeyRef: { name: gateway-deployer, key: deployer-private-key } }
    - { name: DEPLOYER_ADDRESS, value: "0xCf28E90D4A6dB23c34E1881aEF5fd9fF2e478634" }
    # pre-computed addresses the deploy expects (deterministic: same deployer, fresh chain)
    - { name: ZAMA_OFT_ADDRESS, value: "0x5ffdaAB0373E62E2ea2944776209aEf29E631A64" }
    - { name: FEES_SENDER_TO_BURNER_ADDRESS, value: "0x0000111122223333444455556666777788889999" }
    - { name: GATEWAY_CONFIG_ADDRESS, value: "0x576Ea67208b146E63C5255d0f90104E25e3e04c7" }
    - { name: KMS_GENERATION_ADDRESS, value: "0x35760912360E875DA50D40a74305575c23D55783" }
    - { name: PAUSER_SET_ADDRESS, value: "0xacdFB015D1F3D96fBF8BDd3A4b746f4A70123937" }
    - { name: PROTOCOL_NAME, value: "Practice Protocol" }
    - { name: PROTOCOL_WEBSITE, value: "https://practice.invalid" }
    # thresholds for one KMS node and one coprocessor
    - { name: PUBLIC_DECRYPTION_THRESHOLD, value: "1" }
    - { name: USER_DECRYPTION_THRESHOLD, value: "1" }
    - { name: KMS_GENERATION_THRESHOLD, value: "1" }
    - { name: MPC_THRESHOLD, value: "0" }
    - { name: COPROCESSOR_THRESHOLD, value: "1" }
    - { name: KMS_CONTEXT_ID, value: "3166189940082864718613269121331309980362851143201109172953918312716374638593" }
    - { name: NUM_KMS_NODES, value: "1" }
    - { name: KMS_TX_SENDER_ADDRESS_0, value: "0x31de9c8ac5ecd5eaceddddee531e9bad8ac9c2a5" }
    - { name: KMS_SIGNER_ADDRESS_0, value: "0x0Ea5BA6Bdb66553ED882CDB7cc78630340e0F031" }
    - { name: KMS_NODE_IP_ADDRESS_0, value: "127.0.0.1" }
    - { name: KMS_NODE_STORAGE_URL_0, value: "http://minio.infra.svc.cluster.local:9000/kms-public" }
    # the one coprocessor: its tx-sender and signer are the sns-worker wallet (host phrase,
    # account 11), the same address the host InputVerifier registered
    - { name: NUM_COPROCESSORS, value: "1" }
    - { name: COPROCESSOR_TX_SENDER_ADDRESS_0, value: "0x6518D50aDc9036Df37119eA465a8159E34417E2E" }
    - { name: COPROCESSOR_SIGNER_ADDRESS_0, value: "0x6518D50aDc9036Df37119eA465a8159E34417E2E" }
    - { name: COPROCESSOR_S3_BUCKET_URL_0, value: "http://minio.infra.svc.cluster.local:9000/coproc-0" }
    - { name: NUM_CUSTODIANS, value: "1" }
    - { name: CUSTODIAN_TX_SENDER_ADDRESS_0, value: "0x6764Bf471F841dDdc804A03e97Cb76b135faA54c" }
    - { name: CUSTODIAN_SIGNER_ADDRESS_0, value: "0x6764Bf471F841dDdc804A03e97Cb76b135faA54c" }
    # public encryption key of the test custodian, from the upstream template (not a private key)
    - { name: CUSTODIAN_ENCRYPTION_KEY_0, value: "0xea8b8b710d770493a41b588808ea8e09d986561f73d523227718233f3b4742de793f18a9885136a9" }
    # host chain 12345 with the addresses the host contracts deploy wrote
    - { name: NUM_HOST_CHAINS, value: "1" }
    - { name: HOST_CHAIN_CHAIN_ID_0, value: "12345" }
    - name: HOST_CHAIN_FHEVM_EXECUTOR_ADDRESS_0
      valueFrom: { configMapKeyRef: { name: eth-sc-addresses, key: fhevm_executor.address } }
    - name: HOST_CHAIN_ACL_ADDRESS_0
      valueFrom: { configMapKeyRef: { name: eth-sc-addresses, key: acl.address } }
    - { name: HOST_CHAIN_NAME_0, value: "anvil" }
    - { name: HOST_CHAIN_WEBSITE_0, value: "https://anvil.invalid" }
    - { name: NUM_PAUSERS, value: "1" }
    - { name: PAUSER_ADDRESS_0, value: "0x34B344B40eA9Ef21Da5653468a072780d19B1fa4" }
    - { name: INPUT_VERIFICATION_PRICE, value: "10000000000000000000" }
    - { name: PUBLIC_DECRYPTION_PRICE, value: "1000000000000000000" }
    - { name: USER_DECRYPTION_PRICE, value: "1000000000000000000" }
  deployCommands:
    # practice only: the coprocessor's tx-sender wallet is not one of the gateway anvil's funded
    # accounts, so give it gas here (a real operator funds its own wallet)
    - cast rpc --rpc-url "$RPC_URL" anvil_setBalance "$COPROCESSOR_TX_SENDER_ADDRESS_0" 0x3635C9ADC5DEA00000 >/dev/null
    - npx hardhat task:deployAllGatewayContracts
    - npx hardhat task:addHostChainsToGatewayConfig
    - npx hardhat task:addGatewayPausers
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits:   { cpu: "2", memory: 3Gi }
  securityContext:
    runAsNonRoot: true
    runAsUser: 10000
    fsGroup: 10001

persistence:
  enabled: true
  mountPath: /app/addresses
  volumeClaim:
    name: gateway-contracts-addresses
    create: true
    storageClassName: standard
    storageCapacity: 100Mi

scUpgrade:
  enabled: false
