# Runs once per Argo CD sync of the coprocessor-demo application (Sync hook). Re-created on
# every sync, so "sync the app" == "run the check". Output: kubectl logs job/coprocessor-demo -n coproc
apiVersion: batch/v1
kind: Job
metadata:
  name: coprocessor-demo
  namespace: coproc
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: coprocessor-demo }
    spec:
      restartPolicy: Never
      containers:
        - name: coprocessor-demo
          image: local/coprocessor-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: "X", value: "3" }
            - { name: "Y", value: "5" }   # unquoted Y is a YAML boolean
            # $(VAR) expansion only sees variables declared earlier in this list
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: coprocessor-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: coprocessor-db, key: password } }
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.infra.svc.cluster.local:5432/coprocessor
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:   { cpu: "2", memory: 6Gi }   # decrypt loads the server key
