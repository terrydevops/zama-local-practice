# Sync hook of the coprocessor-demo application, re-created on every sync, so "sync the app"
# == "run the check". Scenario transfer: PracticeToken (upstream EncryptedERC20) on anvil, mint,
# one transfer that fits and one that does not, both balances decrypted by the KMS.
# Output: kubectl logs job/coprocessor-demo-transfer -n coproc
apiVersion: batch/v1
kind: Job
metadata:
  name: coprocessor-demo-transfer
  namespace: coproc
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"   # hooks run one wave at a time: same sender account, so no nonce race
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: coprocessor-demo, scenario: transfer }
    spec:
      restartPolicy: Never
      containers:
        - name: coprocessor-demo
          image: local/coprocessor-demo:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: SCENARIO, value: transfer }
            - { name: MINT, value: "1000" }
            - { name: AMOUNT, value: "250" }
            - { name: TOO_MUCH, value: "900" }
            - { name: RPC_URL, value: "http://anvil.infra.svc.cluster.local:8545" }
            - name: PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: demo-sender, key: private-key } }
            - name: ACL_ADDRESS
              valueFrom: { configMapKeyRef: { name: eth-sc-addresses, key: acl.address } }
            - name: FHEVM_EXECUTOR_ADDRESS
              valueFrom: { configMapKeyRef: { name: eth-sc-addresses, key: fhevm_executor.address } }
            - name: KMS_VERIFIER_ADDRESS
              valueFrom: { configMapKeyRef: { name: eth-sc-addresses, key: kms_verifier.address } }
            # the decryption goes through the gateway chain
            - { name: GATEWAY_RPC_URL, value: "http://anvil-gateway.infra.svc.cluster.local:8545" }
            - name: DECRYPTION_ADDRESS
              valueFrom: { configMapKeyRef: { name: gw-sc-addresses, key: decryption.address } }
            - name: PROTOCOL_PAYMENT_ADDRESS
              valueFrom: { configMapKeyRef: { name: gw-sc-addresses, key: protocol_payment.address } }
            - name: CIPHERTEXT_COMMITS_ADDRESS
              valueFrom: { configMapKeyRef: { name: gw-sc-addresses, key: ciphertext_commits.address } }
            # the mocked fee token, as registered by coprocessor/gateway-contracts/values.yaml
            - { name: ZAMA_OFT_ADDRESS, value: "0x5ffdaAB0373E62E2ea2944776209aEf29E631A64" }
            # $(VAR) expansion only sees variables declared earlier in this list
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: coprocessor-db, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: coprocessor-db, key: password } }
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres.infra.svc.cluster.local:5432/coprocessor
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: "1", memory: 512Mi }
