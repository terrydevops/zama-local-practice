[package]
name = "coprocessor-demo"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "coprocessor_demo"
path = "src/main.rs"

[dependencies]
alloy = { version = "2.2.0", default-features = false, features = ["essentials", "std", "reqwest"] }
anyhow = "1.0.98"
hex = "0.4.3"
serde_json = "1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1.45.0", features = ["full"] }
