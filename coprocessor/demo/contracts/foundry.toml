# Compiles the demo contracts against the fhevm checkout, expected at
# ../../../../zama-ai-repos/fhevm (next to this repo; the image build lays the context out
# the same way). Add.sol uses library-solidity; PracticeToken.sol uses the host-contracts
# copy of the library because it inherits the upstream EncryptedERC20 example.
[profile.default]
src = "src"
out = "out"
libs = []
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
remappings = [
  "@fhevm/solidity/=../../../../zama-ai-repos/fhevm/library-solidity/",
  "encrypted-types/=../../../../zama-ai-repos/fhevm/library-solidity/node_modules/encrypted-types/",
  "@fhevm-host-contracts/=../../../../zama-ai-repos/fhevm/host-contracts/",
  "@openzeppelin/=../../../../zama-ai-repos/fhevm/host-contracts/node_modules/@openzeppelin/",
]
allow_paths = ["../../../../zama-ai-repos/fhevm"]
