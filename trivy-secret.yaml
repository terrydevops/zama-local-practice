# Extra secret rules on top of trivy's builtin ones: the builtin set does not match raw hex
# keys. Scoped by path, since a bare 64-hex string is also a block hash or a transaction hash.
rules:
  - id: ethereum-raw-private-key
    category: Ethereum
    title: Raw 32-byte hex key
    severity: CRITICAL
    regex: '\b(0x)?[0-9a-fA-F]{64}\b'
    path: '(\.key|\.hex|\.pem)$|(^|/)\.env|(^|/)secrets/'
  - id: bip39-mnemonic-assignment
    category: Ethereum
    title: Mnemonic phrase assigned in a file
    severity: CRITICAL
    regex: '(?i)mnemonic["'']?\s*[:=]\s*["'']?([a-z]+ ){11,23}[a-z]+'
